# RuboCop replaces its default AllCops/Exclude with the one below instead of
# adding to it, and CI installs the bundle into vendor/bundle, where a gem with
# a .rubocop.yml of its own would be picked up.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.2
  SuggestExtensions: false

# Development dependencies are declared in the gemspec, next to the runtime ones.
Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

Lint/SuppressedException:
  Exclude:
    - 'bin/console'
    - 'bin/setup'

Style/FrozenStringLiteralComment:
  Enabled: false
Style/Encoding:
  Enabled: true
Style/NumericLiterals:
  Enabled: false
Style/RescueModifier:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/GuardClause:
  Description: Check for conditionals that can be replaced with guard clauses
  StyleGuide: https://github.com/bbatsov/ruby-style-guide#no-nested-conditionals
  Enabled: true
  MinBodyLength: 1

# The endpoint parameter table and the route constants read better in columns.
Layout/HashAlignment:
  EnforcedHashRocketStyle:
    - key
    - table
  EnforcedColonStyle:
    - key
    - table

Layout/LineLength:
  Max: 120
Metrics/AbcSize:
  Max: 999
Metrics/ClassLength:
  Max: 999
Metrics/CyclomaticComplexity:
  Max: 99
Metrics/MethodLength:
  Max: 999
Metrics/ModuleLength:
  Max: 999
Metrics/ParameterLists:
  Max: 10
Metrics/PerceivedComplexity:
  Max: 99

Metrics/BlockLength:
  Exclude:
    - '**/*.rake'
    - 'spec/**/*.rb'
    - 'config/**/*.rb'
